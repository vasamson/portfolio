<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet | Valentin Samson</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light: #f8fafc;
            --bg-dark: #0f172a;
            --text-light: #0f172a;
            --text-dark: #f1f5f9;
            --card-bg-light: rgba(255, 255, 255, 0.8);
            --card-bg-dark: rgba(30, 41, 59, 0.7);
            --border-light: rgba(255, 255, 255, 0.5);
            --border-dark: rgba(255, 255, 255, 0.05);
            --accent: #4f46e5;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-light);
            margin: 0;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        body.dark-mode {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        .project-hero {
            height: 75vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            filter: brightness(0.5) saturate(1.2);
            transform: scale(1.1);
            transition: transform 2s ease-out, filter 0.5s ease;
        }

        .project-hero:hover .hero-bg {
            transform: scale(1.05);
            filter: brightness(0.4) saturate(1.4);
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 0%, rgba(15, 23, 42, 0.8) 100%);
            z-index: 5;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 900px;
            padding: 0 40px;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 10px 24px;
            border-radius: 100px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-size: 0.75rem;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
        }

        .hero-title {
            font-size: clamp(2.8rem, 10vw, 5rem);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -0.05em;
            margin-bottom: 20px;
            animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s backwards;
        }

        .project-main {
            max-width: 1200px;
            margin: -100px auto 120px;
            position: relative;
            z-index: 20;
            padding: 0 25px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 50px;
        }

        .content-card {
            background: var(--card-bg-light);
            backdrop-filter: blur(30px);
            border-radius: 48px;
            padding: 80px;
            border: 1px solid var(--border-light);
            box-shadow: 0 40px 100px rgba(0,0,0,0.08);
            animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s backwards;
        }

        body.dark-mode .content-card {
            background: var(--card-bg-dark);
            border-color: var(--border-dark);
            box-shadow: 0 40px 100px rgba(0,0,0,0.3);
        }

        .sidebar-card {
            background: white;
            border-radius: 48px;
            padding: 50px;
            height: fit-content;
            border: 1px solid rgba(0,0,0,0.04);
            box-shadow: 0 20px 60px rgba(0,0,0,0.04);
            animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s backwards;
            position: sticky;
            top: 120px;
        }

        body.dark-mode .sidebar-card {
            background: #1e293b;
            border-color: rgba(255,255,255,0.05);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .section-title {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, #e2e8f0, transparent);
        }

        body.dark-mode .section-title::after {
            background: linear-gradient(to right, rgba(255,255,255,0.1), transparent);
        }

        .description-text {
            font-size: 1.25rem;
            line-height: 1.85;
            color: #475569;
            margin-bottom: 50px;
            font-weight: 450;
        }

        body.dark-mode .description-text {
            color: #94a3b8;
        }

        .tools-list {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .tool-chip {
            background: #f1f5f9;
            color: #475569;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid transparent;
        }

        body.dark-mode .tool-chip {
            background: #0f172a;
            color: #94a3b8;
        }

        .tool-chip:hover {
            background: var(--accent);
            color: white;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .sidebar-item {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        body.dark-mode .sidebar-item {
            border-bottom-color: rgba(255,255,255,0.05);
        }

        .sidebar-item:last-of-type {
            border-bottom: none;
        }

        .sidebar-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 900;
            color: #94a3b8;
            letter-spacing: 0.15em;
            margin-bottom: 12px;
            display: block;
        }

        .sidebar-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e293b;
        }

        body.dark-mode .sidebar-value {
            color: #f1f5f9;
        }

        .back-btn {
            position: fixed;
            top: 40px;
            left: 40px;
            z-index: 100;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(12px);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .back-btn:hover {
            background: white;
            color: #0f172a;
            transform: translateX(-5px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1024px) {
            .project-main {
                grid-template-columns: 1fr;
                margin-top: -60px;
                gap: 30px;
            }
            .content-card { padding: 50px; border-radius: 40px; }
            .sidebar-card { position: static; width: 100%; border-radius: 40px; }
        }

        @media (max-width: 768px) {
            .back-btn { top: 20px; left: 20px; width: 50px; height: 50px; border-radius: 15px; }
            .hero-title { font-size: 3.5rem; }
            .content-card { padding: 40px 30px; }
        }

        .theme-toggle {
            position: fixed;
            top: 40px;
            right: 40px;
            z-index: 100;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(12px);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.4s ease;
        }

        .theme-toggle:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.1);
        }
    </style>

</head>
<body>

    <a href="index.html#projects" class="back-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>

    <header class="project-hero">
        <div class="hero-bg" id="hero-bg"></div>
        <div class="hero-content">

            <h1 class="hero-title" id="project-title">Titre du Projet</h1>
        </div>
    </header>

    <main class="project-main">
        <div class="gradient-accent"></div>
        <article class="content-card">
            <h2 class="section-title">À propos du projet</h2>
            <div class="description-text" id="project-full-description">
                Description détaillée ici...
            </div>

            <h2 class="section-title">Outils & Technologies</h2>
            <div class="tools-list" id="project-tools">
                <!-- Les outils seront chargés ici -->
            </div>
        </article>

        <aside class="sidebar-card">
            <div class="sidebar-item">
                <span class="sidebar-label">Année</span>
                <span class="sidebar-value" id="project-year">2024</span>
            </div>
            <div class="sidebar-item">
                <span class="sidebar-label">Client / Context</span>
                <span class="sidebar-value" id="project-context">Valentin Samson</span>
            </div>
            <div class="sidebar-item">
                <span class="sidebar-label">Type</span>
                <span class="sidebar-value" id="project-type">Design & Dev</span>
            </div>
            
            <a href="#contact" class="btn-premium" style="display: block; text-align: center; margin-top: 40px; width: 100%; box-sizing: border-box;">
                Lancer un projet
            </a>
        </aside>
    </main>

    <script src="projects.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // SYNC DARK MODE
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
            }

            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');

            if (projectId && projectsData[projectId]) {
                const project = projectsData[projectId];

                document.title = `${project.title} | Valentin Samson`;
                document.getElementById('project-title').textContent = project.title;
                // document.getElementById('project-category').textContent = project.category; // Removed as per request
                document.getElementById('project-full-description').textContent = project.fullDescription;
                document.getElementById('hero-bg').style.backgroundImage = `url('${project.image}')`;
                document.getElementById('project-year').textContent = project.year;
                document.getElementById('project-type').textContent = project.category;

                const toolsContainer = document.getElementById('project-tools');
                project.tools.forEach(tool => {
                    const chip = document.createElement('span');
                    chip.className = 'tool-chip';
                    chip.textContent = tool;
                    toolsContainer.appendChild(chip);
                });
            } else {
                // Rediriger vers l'index si le projet n'existe pas
                window.location.href = 'index.html';
            }
        });
    </script>

</body>
</html>
