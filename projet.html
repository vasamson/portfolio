<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet | Valentin Samson</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-light: #ffffff;
            --bg-dark: #0f172a;
            --text-light: #0f172a;
            --text-dark: #f1f5f9;
            --accent: #4f46e5;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow-x: hidden;
            background: transparent;
            color: var(--text-light);
            line-height: 1.6;
        }

        body.dark-mode {
            color: var(--text-dark);
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        /* Hero Section Premium */
        .project-hero {
            height: 60vh;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding-bottom: 120px;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: saturate(1.2) brightness(0.8);
            z-index: -1;
            transition: transform 1s ease;
        }

        .project-hero:hover .hero-bg {
            transform: scale(1.05);
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.6) 100%);
            z-index: 0;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding: 0 40px;
        }

        .hero-title {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            color: white;
            line-height: 1;
            letter-spacing: -0.04em;
            margin: 0;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Layout */
        .project-main {
            max-width: 1200px;
            margin: -60px auto 100px;
            padding: 0 40px;
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 40px;
            position: relative;
            z-index: 20;
        }

        .content-card, .sidebar-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        }

        body.dark-mode .content-card,
        body.dark-mode .sidebar-card {
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 850;
            margin-bottom: 25px;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-title::before {
            content: "";
            width: 8px;
            height: 30px;
            background: var(--accent);
            border-radius: 4px;
        }

        .description-text {
            font-size: 1.15rem;
            color: #475569;
            margin-bottom: 40px;
            white-space: pre-line;
        }

        body.dark-mode .description-text {
            color: #cbd5e1;
        }

        /* Tools Chips */
        .tools-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tool-chip {
            background: rgba(79, 70, 229, 0.1);
            color: var(--accent);
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            border: 1px solid rgba(79, 70, 229, 0.2);
            transition: all 0.3s ease;
        }

        .tool-chip:hover {
            background: var(--accent);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2);
        }

        /* Sidebar Styling */
        .sidebar-item {
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 20px;
        }

        body.dark-mode .sidebar-item {
            border-bottom-color: rgba(255,255,255,0.05);
        }

        .sidebar-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .sidebar-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 800;
            color: #94a3b8;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            display: block;
        }

        .sidebar-value {
            font-size: 1.3rem;
            font-weight: 700;
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            color: #0f172a;
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(0,0,0,0.05);
        }

        body.dark-mode .back-btn {
            background: #1e293b;
            color: white;
            border-color: rgba(255,255,255,0.1);
        }

        .back-btn:hover {
            transform: scale(1.1) rotate(-5deg);
            background: var(--accent);
            color: white;
        }

        /* Mobile Adjustments */
        @media (max-width: 968px) {
            .project-main {
                grid-template-columns: 1fr;
                margin-top: -40px;
            }
            .content-card, .sidebar-card {
                padding: 30px;
            }
            .hero-title {
                font-size: 3.5rem;
            }
        }

        .btn-premium {
            background: linear-gradient(135deg, var(--accent), #6366f1);
            color: white;
            padding: 18px 30px;
            border-radius: 20px;
            font-weight: 800;
            text-decoration: none;
            display: inline-block;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.95rem;
            position: relative;
            overflow: hidden;
        }

        .btn-premium::before {
            content: "";
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .btn-premium:hover::before {
            left: 100%;
        }

        .btn-premium:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 35px rgba(79, 70, 229, 0.4);
            filter: brightness(1.1);
        }

        .theme-toggle {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 100;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(12px);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.4s ease;
        }

        .theme-toggle:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.1);
        }
    </style>

</head>
<body>

    <!-- Same dynamic background as index for consistency -->
    <div class="liquid-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="site-waves"></div>

    <a href="index.html#projects" class="back-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </a>

    <header class="project-hero">
        <div class="hero-bg" id="hero-bg"></div>
        <div class="hero-content">

            <h1 class="hero-title" id="project-title">Titre du Projet</h1>
        </div>
    </header>

    <main class="project-main">
        <div class="gradient-accent"></div>
        <article class="content-card">
            <h2 class="section-title">À propos du projet</h2>
            <div class="description-text" id="project-full-description">
                Description détaillée ici...
            </div>

            <h2 class="section-title">Outils & Technologies</h2>
            <div class="tools-list" id="project-tools">
                <!-- Les outils seront chargés ici -->
            </div>
        </article>

        <aside class="sidebar-card">
            <div class="sidebar-item">
                <span class="sidebar-label">Année</span>
                <span class="sidebar-value" id="project-year">2024</span>
            </div>
            <div class="sidebar-item">
                <span class="sidebar-label">Client / Context</span>
                <span class="sidebar-value" id="project-context">Valentin Samson</span>
            </div>
            <div class="sidebar-item">
                <span class="sidebar-label">Type</span>
                <span class="sidebar-value" id="project-type">Design & Dev</span>
            </div>
            
            <a href="index.html#contact" class="btn-premium" style="display: block; text-align: center; margin-top: 40px;">
                Lancer un projet
            </a>
        </aside>
    </main>

    <script src="projects.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // SYNC DARK MODE
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
            }

            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');

            if (projectId && projectsData[projectId]) {
                const project = projectsData[projectId];

                document.title = `${project.title} | Valentin Samson`;
                document.getElementById('project-title').textContent = project.title;
                // document.getElementById('project-category').textContent = project.category; // Removed as per request
                document.getElementById('project-full-description').textContent = project.fullDescription;
                document.getElementById('hero-bg').style.backgroundImage = `url('${project.image}')`;
                document.getElementById('project-year').textContent = project.year;
                document.getElementById('project-type').textContent = project.category;

                const toolsContainer = document.getElementById('project-tools');
                project.tools.forEach(tool => {
                    const chip = document.createElement('span');
                    chip.className = 'tool-chip';
                    chip.textContent = tool;
                    toolsContainer.appendChild(chip);
                });
            } else {
                // Rediriger vers l'index si le projet n'existe pas
                window.location.href = 'index.html';
            }
        });
    </script>

</body>
</html>
