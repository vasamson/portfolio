<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="cursor"></div>
  <div class="cursor-follower"></div>


  <nav>
    <div class="logo">Valentin Samson</div>
    <ul class="nav-links">
      <li><a href="#about">À propos</a></li>
      <li><a href="#projects">Projets</a></li>
      <li><a href="#skills">Compétences</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>


  <section class="hero">
    <div class="ink-blot">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path fill="currentColor" d="M44.7,-76.4C58.8,-69.2,71.8,-59.1,79.6,-45.8C87.4,-32.6,90,-16.3,88.5,-0.9C87,14.6,81.4,29.2,73.1,42.8C64.8,56.4,53.8,69,40.1,76.8C26.4,84.6,10,87.6,-5.8,86.4C-21.6,85.2,-37,79.8,-50.1,71.5C-63.2,63.2,-74,52,-80.3,38.4C-86.6,24.8,-88.4,8.8,-86.7,-6.5C-85,-21.8,-79.8,-36.4,-71.5,-49.2C-63.2,-62,-51.8,-73,-38.4,-79.5C-25,-86,-12.5,-88,0.7,-89.2C13.9,-90.4,30.6,-83.6,44.7,-76.4Z" transform="translate(100 100)" />
      </svg>
    </div>

  
    <div class="particle" style="top: 20%; left: 10%; animation-delay: 0s;"></div>
    <div class="particle" style="top: 40%; left: 85%; animation-delay: 1s;"></div>
    <div class="particle" style="top: 70%; left: 15%; animation-delay: 2s;"></div>
    <div class="particle" style="top: 60%; left: 80%; animation-delay: 1.5s;"></div>
    <div class="particle" style="top: 30%; left: 50%; animation-delay: 0.5s;"></div>

  
    <svg class="sketch-line" style="position: absolute; top: 15%; left: 5%; width: 150px; height: 150px;">
      <path d="M10,10 Q50,80 90,40 T150,100" stroke-linecap="round"/>
    </svg>
    <svg class="sketch-line" style="position: absolute; bottom: 20%; right: 8%; width: 120px; height: 120px;">
      <path d="M10,60 Q60,10 110,60" stroke-linecap="round"/>
    </svg>

 
    <div class="hero-content">
      <p class="greeting">Bonjour, je suis</p>
      <h1 class="hero-name">Valentin Samson</h1>
      <p class="manifesto">
        Je transforme les <span class="highlight">idées</span> en <span class="highlight">réalités</span>
      </p>
      <p class="role">ÉTUDIANT MMI</p>
      
      <div class="cta-container">
        <a href="#projects" class="cta-btn primary">Découvrir mes projets</a>
        <a href="#contact" class="cta-btn">Me contacter</a>
      </div>
    </div>

  
    <div class="scroll-indicator">
      <p class="scroll-text">Explorez mon univers</p>
      <div class="scroll-arrow"></div>
    </div>
  </section>

  <script>

    const cursor = document.querySelector('.cursor');
    const follower = document.querySelector('.cursor-follower');

    let mouseX = 0, mouseY = 0;
    let followerX = 0, followerY = 0;

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      
      cursor.style.left = mouseX + 'px';
      cursor.style.top = mouseY + 'px';
    });


    function animateFollower() {
      const dx = mouseX - followerX;
      const dy = mouseY - followerY;
      
      followerX += dx * 0.1;
      followerY += dy * 0.1;
      
      follower.style.left = followerX + 'px';
      follower.style.top = followerY + 'px';
      
      requestAnimationFrame(animateFollower);
    }
    animateFollower();

    const interactiveElements = document.querySelectorAll('a, button, .cta-btn');
    interactiveElements.forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursor.style.transform = 'scale(1.5)';
        cursor.style.borderColor = 'var(--corail)';
      });
      el.addEventListener('mouseleave', () => {
        cursor.style.transform = 'scale(1)';
        cursor.style.borderColor = 'var(--indigo)';
      });
    });


    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      });
    });

  
    document.addEventListener('mousemove', (e) => {
      const particles = document.querySelectorAll('.particle');
      const x = e.clientX / window.innerWidth;
      const y = e.clientY / window.innerHeight;
      
      particles.forEach((particle, i) => {
        const speed = (i + 1) * 0.5;
        const xMove = (x - 0.5) * speed * 20;
        const yMove = (y - 0.5) * speed * 20;
        particle.style.transform = `translate(${xMove}px, ${yMove}px)`;
      });
    });

    if ('ontouchstart' in window) {
      cursor.style.display = 'none';
      follower.style.display = 'none';
    }
  </script>
</body>
</html>
